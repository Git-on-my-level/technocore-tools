name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README tool table freshness
        run: python3 scripts/gen_readme_tools.py --check

      - name: Tools compile + have docstrings
        run: python3 scripts/check_tools.py
